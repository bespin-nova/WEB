<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#121318">
    <title>페이지를 찾을 수 없습니다 · PetClinic</title>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <style>
        :root {
            --background: #121318;
            --background-deep: #28212b;
            --text-primary: #fffaf7;
            --text-secondary: #d2cbcd;
            --border-color: rgba(255, 231, 225, 0.18);
            --primary: #f2a69a;
            --accent-bright: #ffc8bc;
            color-scheme: dark;
        }

        * { box-sizing: border-box; }
        html, body { min-height: 100%; margin: 0; }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--text-primary);
            font-family: "Trebuchet MS", "Noto Sans KR", sans-serif;
            background: linear-gradient(135deg, var(--background), var(--background-deep));
            transition: background 180ms ease, color 180ms ease;
        }

        main {
            position: relative;
            isolation: isolate;
            flex: 1;
            display: grid;
            place-items: center;
            overflow: hidden;
            padding: clamp(42px, 8vw, 100px) clamp(20px, 8vw, 120px);
        }
        main::before { position: absolute; z-index: -2; inset: 0; background: linear-gradient(90deg, rgba(18,19,24,.98) 0%, rgba(28,25,32,.88) 48%, rgba(28,25,32,.3) 100%), url("/images/dog.png") center 42% / cover; content: ""; }
        main::after { position: absolute; z-index: -1; width: 42vw; height: 42vw; right: -15vw; bottom: -25vw; border: 1px solid rgba(242,166,154,.24); border-radius: 50%; box-shadow: 0 0 0 8vw rgba(242,166,154,.035), 0 0 0 16vw rgba(198,180,237,.025); content: ""; }
        .error-layout { width: min(1120px, 100%); display: grid; grid-template-columns: minmax(0, 620px) 1fr; align-items: center; gap: clamp(40px, 8vw, 120px); }
        .error-content { padding: clamp(28px, 5vw, 54px); border-left: 3px solid var(--primary); background: rgba(15,16,24,.64); box-shadow: 0 24px 80px rgba(0,0,0,.2); backdrop-filter: blur(7px); }
        .eyebrow { margin: 0 0 16px; color: var(--accent-bright); font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
        h1 { margin: 0 0 22px; font-family: Georgia, serif; font-size: clamp(48px, 7vw, 82px); font-weight: 400; line-height: .98; }
        .description { max-width: 510px; margin: 0; color: var(--text-secondary); font-size: 16px; line-height: 1.8; word-break: keep-all; }
        .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
        .button { display: inline-flex; min-height: 46px; align-items: center; justify-content: center; padding: 0 22px; color: #211d22; font-size: 14px; font-weight: 700; text-decoration: none; border: 1px solid var(--primary); border-radius: 8px; background: var(--primary); transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease; }
        .button:hover { background: var(--accent-bright); transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,0,0,.22); }
        .button.secondary { color: var(--text-primary); background: rgba(255,255,255,.05); }
        .button:focus-visible { outline: 3px solid rgba(242,166,154,.28); outline-offset: 3px; }
        .error-code { color: rgba(255,250,247,.12); font-family: Georgia, serif; font-size: clamp(130px, 20vw, 270px); line-height: .72; letter-spacing: -.08em; text-align: center; text-shadow: 0 1px 0 rgba(255,255,255,.08); user-select: none; }
        body[data-theme="light"] { --background: #fffdfb; --background-deep: #f9e9e5; --text-primary: #211d22; --text-secondary: #62585d; --border-color: rgba(78,54,61,.16); --primary: #df9589; --accent-bright: #a75f58; color-scheme: light; }
        body[data-theme="light"] main::before { background: linear-gradient(90deg, rgba(255,253,251,.98) 0%, rgba(249,233,229,.88) 48%, rgba(249,233,229,.34) 100%), url("/images/dog.png") center 42% / cover; }
        body[data-theme="light"] .error-content { background: rgba(255,255,255,.7); }
        body[data-theme="light"] .error-code { color: rgba(78,54,61,.13); }

        @media (max-width: 760px) {
            .error-layout { grid-template-columns: 1fr; gap: 32px; }
            .error-code { grid-row: 1; font-size: clamp(100px, 38vw, 170px); }
            .error-content { grid-row: 2; padding: 28px; }
            main::before { background-position: 65% center; }
            .button { flex: 1 1 150px; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }
    </style>
</head>
<body>
    <main>
        <div class="error-layout">
            <section class="error-content" aria-labelledby="error-title">
                <p class="eyebrow">404 · LOST PAW</p>
                <h1 id="error-title">길을 잃은<br>페이지예요.</h1>
                <p class="description">요청하신 페이지가 이동했거나 주소가 정확하지 않은 것 같아요. 걱정하지 마세요. 안전한 곳으로 다시 안내해 드릴게요.</p>
                <div class="actions">
                    <a class="button" href="/">홈으로 돌아가기</a>
                    <button class="button secondary" id="back-button" type="button">이전 페이지</button>
                </div>
            </section>
            <div class="error-code" aria-hidden="true">404</div>
        </div>
    </main>
    <script>
        document.querySelector('#back-button').addEventListener('click', () => history.back());
    </script>
</body>
</html>
